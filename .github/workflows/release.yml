name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  build:
    # 打包：sdist + wheel → GitHub Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    # 镜像：构建 + 冒烟 + 推 GHCR（ghcr.io/<owner>/social-hub）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & smoke
        run: |
          IMG=ghcr.io/${{ github.repository }}
          docker build -f deploy/Dockerfile \
            -t "$IMG:${GITHUB_REF_NAME#v}" -t "$IMG:latest" .
          docker run --rm "$IMG:latest" shub --help

      - name: Push
        run: |
          IMG=ghcr.io/${{ github.repository }}
          docker push "$IMG:${GITHUB_REF_NAME#v}"
          docker push "$IMG:latest"
